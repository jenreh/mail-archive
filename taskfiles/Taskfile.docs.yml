# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  DOCS_DIR: docs

tasks:
  dev:
    desc: Start the VitePress dev server with live reload
    dir: "{{.DOCS_DIR}}"
    cmds:
      - npm run docs:dev

  build:
    desc: Build the VitePress documentation site
    dir: "{{.DOCS_DIR}}"
    cmds:
      - npm run docs:build
    generates:
      - "{{.DOCS_DIR}}/.vitepress/dist/index.html"

  preview:
    desc: Preview the production build locally
    dir: "{{.DOCS_DIR}}"
    cmds:
      - npm run docs:preview

  install:
    desc: Install docs dependencies
    dir: "{{.DOCS_DIR}}"
    cmds:
      - npm install

  diagrams:
    desc: Regenerate every .drawio and .svg under docs/diagrams
    # Deliberately not a dependency of `build`: the site builds with npm alone,
    # and requiring uv for it would make the docs need the Python toolchain.
    # Run this after editing docs/diagrams/diagrams.py, then build.
    cmds:
      - uv run python {{.DOCS_DIR}}/diagrams/build.py
    sources:
      - "{{.DOCS_DIR}}/diagrams/*.py"
    generates:
      - "{{.DOCS_DIR}}/diagrams/*.drawio"
      - "{{.DOCS_DIR}}/diagrams/*.svg"
