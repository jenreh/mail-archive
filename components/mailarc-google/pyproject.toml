[project]
name = "mailarc-google"
version = "1.0.0"
description = "Mail archive Gmail adapter: OAuth, paging and message mapping"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Jens Rehpöhler" }]

# Hangs off the core alone. The HTTP and Google auth dependencies arrive in
# phase 3, together with the code that needs them.
dependencies = ["mailarc-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailarc_google"]

[tool.pytest.ini_options]
cache_dir = "../../.cache/pytest"
testpaths = ["tests"]
asyncio_mode = "auto"
