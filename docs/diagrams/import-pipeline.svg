<svg xmlns="http://www.w3.org/2000/svg" width="756" height="1006" viewBox="0 0 756 1006" role="img" aria-label="The import pipeline">
<title>The import pipeline</title>
<defs><marker id="aB3261E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B3261E" /></marker><marker id="a2E7D46" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#2E7D46" /></marker><marker id="a1F2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F2328" /></marker><marker id="a57606A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#57606A" /></marker></defs>
<rect width="756" height="1006" fill="#FFFFFF" />
<g transform="translate(-138,-16)">
<rect x="320" y="40" width="250" height="58" rx="8" fill="#FEF7E0" stroke="#A6740A" stroke-width="1.4" /><text x="445.0" y="66.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">MailSourcePort</text><text x="445.0" y="80.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">Gmail · a folder of .eml files</text>
<rect x="320" y="140" width="250" height="58" rx="8" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.4" /><text x="445.0" y="166.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">list_messages(cursor)</text><text x="445.0" y="180.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">one page of references</text>
<rect x="320" y="240" width="250" height="58" rx="8" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.4" /><text x="445.0" y="266.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">drop what this account already has</text><text x="445.0" y="280.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">one IN (…) per page</text>
<rect x="320" y="340" width="250" height="58" rx="8" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.4" /><text x="445.0" y="366.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">fetch_raw(slice)</text><text x="445.0" y="380.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">semaphore · 8 streams · 5 retries</text>
<rect x="320" y="440" width="250" height="58" rx="8" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.4" /><text x="445.0" y="466.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">parse + store the bytes</text><text x="445.0" y="480.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">stdlib email, in a thread</text>
<rect x="320" y="540" width="250" height="58" rx="8" fill="#E0F7FA" stroke="#00707F" stroke-width="1.4" /><text x="445.0" y="566.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">asyncio.Queue</text><text x="445.0" y="580.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">a message, or a failure — never nothing</text>
<rect x="320" y="640" width="250" height="58" rx="8" fill="#E0F7FA" stroke="#00707F" stroke-width="1.4" /><text x="445.0" y="666.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">the one archive consumer</text><text x="445.0" y="680.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">buffers up to batch_size</text>
<rect x="320" y="740" width="250" height="58" rx="8" fill="#E8F0FE" stroke="#3B5BA5" stroke-width="1.4" /><text x="445.0" y="766.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">1. MessageArchiver</text><text x="445.0" y="780.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">graph first, so a crash re-imports</text>
<rect x="320" y="840" width="250" height="58" rx="8" fill="#E8F0FE" stroke="#3B5BA5" stroke-width="1.4" /><text x="445.0" y="866.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">2. record archived and failed</text><text x="445.0" y="880.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">one transaction per batch</text>
<rect x="320" y="940" width="250" height="58" rx="8" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.4" /><text x="445.0" y="966.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">3. checkpoint the cursor</text><text x="445.0" y="980.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">every checkpoint_every messages</text>
<rect x="660" y="240" width="210" height="58" rx="8" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.4" /><text x="765.0" y="266.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">SQLite</text><text x="765.0" y="280.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">mail_archived_messages</text>
<rect x="660" y="440" width="210" height="58" rx="8" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.4" /><text x="765.0" y="466.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">blob store</text><text x="765.0" y="480.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">.eml and attachments, by sha256</text>
<rect x="660" y="740" width="210" height="58" rx="8" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.4" /><text x="765.0" y="766.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">graph</text><text x="765.0" y="780.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">nodes and edges</text>
<rect x="660" y="890" width="210" height="58" rx="8" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.4" /><text x="765.0" y="916.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">SQLite</text><text x="765.0" y="930.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">archived · failed · checkpoint</text>
