profile: default

reflex:
  deploy_url: http://localhost
  frontend_port: 8080
  backend_port: 3030
  workers: 1

app:
  version: 1.0.0
  name: mail-archive
  logging: logging.prod.yaml
  environment: production
  backend_timeout: 180 # seconds

  database:
    type: sqlite
    # appkit_commons hands this ONE url to both the sync and the async engine.
    # The application only ever opens async sessions (every appkit_user state
    # does), so it has to name an async driver. The sync-only consumers —
    # Alembic and Reflex's db_url — convert it back with
    # mailarc_core.database.sqlite.sync_database_url().
    url: sqlite+aiosqlite:///.state/mail-archive.db
    encryption_key: secret:mn-db-encryption-key
    echo: False # Set to True to enable SQL logging

  # Cloud/server deployments connect to a graph somebody else operates.
  # The desktop app overrides this to `local` via the `prod` profile.
  #
  # `backend` picks the driver runic builds: falkordb | neo4j | memgraph |
  # arcadedb | age. Only falkordb can run with `mode: local` — the vendored
  # runtime is a redis-server. The others need `mode: remote` plus
  # `database`, `username` and `password`.
  graph:
    mode: local
    backend: falkordb
    host: 127.0.0.1
    port: 6379
    graph_name: mail-archive

  # The OAuth client every Gmail mailbox on this installation connects
  # through. It belongs to whoever deploys the application — the consent
  # screen and the 250 units/user/s quota are theirs — so it is configured
  # once here and no user is ever asked to make a Google Cloud project.
  # Both come from the secret provider: neither belongs in a committed file.
  # Leave them unset and the account page simply says Gmail is not set up.
  google:
    client_id: secret:mn-google-client-id
    client_secret: secret:mn-google-client-secret

  authentication:
    session_timeout: 25 # minutes
    auth_token_refresh_delta: 10 # minutes
    server_url: https://localhost
    server_port: 8080

