profile: default

reflex:
  deploy_url: http://localhost
  frontend_port: 8080
  backend_port: 3030
  workers: 1

app:
  version: 1.0.0
  name: mail-archive
  logging: logging.prod.yaml
  environment: production
  backend_timeout: 180 # seconds

  database:
    type: sqlite
    # appkit_commons hands this ONE url to both the sync and the async engine.
    # The application only ever opens async sessions (every page state and
    # the job queue do), so it has to name an async driver. The sync-only
    # consumers — Alembic and Reflex's db_url — convert it back with
    # mailarc_core.database.sqlite.sync_database_url().
    url: sqlite+aiosqlite:///.state/mail-archive.db
    encryption_key: secret:mn-db-encryption-key
    echo: False # Set to True to enable SQL logging

  # Cloud/server deployments connect to a graph somebody else operates.
  # The desktop app overrides this to `local` via the `prod` profile.
  #
  # `backend` picks the driver runic builds: falkordb | neo4j | memgraph |
  # arcadedb | age. Only falkordb can run with `mode: local` — the vendored
  # runtime is a redis-server. The others need `mode: remote` plus
  # `database`, `username` and `password`.
  graph:
    mode: local
    backend: falkordb
    host: 127.0.0.1
    port: 6379
    graph_name: mail-archive

  # The OAuth client every Gmail mailbox on this installation connects
  # through. It belongs to whoever deploys the application — the consent
  # screen and the 250 units/user/s quota are theirs — so it is configured
  # once here and no user is ever asked to make a Google Cloud project.
  # Both come from the secret provider: neither belongs in a committed file.
  # Leave them unset and the account page simply says Gmail is not set up.
  google:
    client_id: secret:mn-google-client-id
    client_secret: secret:mn-google-client-secret

  # IMAP has nothing here that a mailbox needs, and that is the whole shape of
  # this provider: the host, the port, the username, the app password and the
  # folder belong to the *account*, so they are credential fields and live
  # encrypted in `mail_credentials.secret`. A second IMAP mailbox therefore
  # needs no second setting, which is what an archive holding an iCloud account
  # and a Gmail-app-password account requires.
  #
  # What is left is genuinely per-installation and every value below is the
  # default — uncomment a line only to change it. There is deliberately no
  # switch to turn TLS off: an app password in the clear is the credential
  # itself.
  #
  #imap:
  #  connect_timeout: 15    # seconds for the TCP connect and the TLS handshake
  #  request_timeout: 120   # seconds for one command; a big attachment is one
  #  page_size: 200         # UIDs per listing page, sliced out of UID SEARCH
  #  tls_ca_file: ""        # a PEM bundle for a private CA; empty = the system's

  # The Entra application every Microsoft 365 mailbox on this installation
  # signs in through. It belongs to whoever deploys the application, exactly as
  # the Google client above does, so it is configured once here and nobody
  # adding a mailbox is asked to create an app registration.
  #
  # Commented out rather than shipped live, and the reason is mechanical: a
  # `secret:` reference is resolved eagerly while the configuration is
  # validated, and a key the secret provider does not hold fails the *whole*
  # startup. Google's two are already in every existing `.env`; these two are
  # not. So an installation that has an Entra registration uncomments both
  # lines and puts the values in its `.env` (`.env.default` carries the
  # placeholders); one that does not leaves them alone and the account page
  # says Microsoft 365 is not set up.
  #
  # `client_secret` is app-only's alone — a client-credentials grant presents
  # it to get a token for the tenant. A delegated (per-user) sign-in is a
  # public client and must NOT have one, so a desktop installation sets only
  # the id. Neither belongs in a committed file.
  #
  m365:
    client_id: secret:mn-m365-client-id
    client_secret: secret:mn-m365-client-secret
    delta_folder: allitems
    default_tenant: common
