[project]
name = "mailarc-google"
version = "1.0.0"
description = "Mail archive Gmail adapter: OAuth, paging and message mapping"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Jens Rehpöhler" }]

# Hangs off the core plus the two things the Gmail adapter needs itself: an
# HTTP client and Google's OAuth flow. Never a sibling component.
dependencies = [
    "google-auth>=2.57.0",
    "google-auth-oauthlib>=1.4.0",
    "httpx>=0.28.1",
    "mailarc-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailarc_google"]

[tool.pytest.ini_options]
cache_dir = "../../.cache/pytest"
testpaths = ["tests"]
asyncio_mode = "auto"
