<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mail-archive</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfd;
        --fg: #1c1c1e;
        --muted: #6b6b70;
        --accent: #3b6fd4;
        --error-bg: #fdf1f1;
        --error-fg: #8a1c1c;
        --error-border: #e9c4c4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17171a;
          --fg: #ededf0;
          --muted: #9a9aa2;
          --accent: #6f9dee;
          --error-bg: #241a1a;
          --error-fg: #f0b4b4;
          --error-border: #4a2a2a;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      .panel { max-width: 46rem; width: 100%; text-align: center; }
      h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 0.35rem; }
      p { color: var(--muted); margin: 0; }
      .spinner {
        width: 30px; height: 30px; margin: 0 auto 1.4rem;
        border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .spinner { animation-duration: 3s; }
      }
      .hidden { display: none; }
      #error { text-align: left; }
      #error h1 { text-align: center; }
      pre {
        background: var(--error-bg);
        color: var(--error-fg);
        border: 1px solid var(--error-border);
        border-radius: 8px;
        padding: 0.85rem 1rem;
        margin-top: 1rem;
        max-height: 22rem;
        overflow: auto;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="panel" id="loading">
      <div class="spinner"></div>
      <h1>Starting mail-archive…</h1>
      <p>The first launch compiles the frontend, which can take a minute.</p>
    </div>

    <div class="panel hidden" id="error">
      <h1>mail-archive could not start</h1>
      <p>The backend did not come up. Its last output:</p>
      <pre id="error-detail"></pre>
    </div>

    <script type="module">
      // Polled, not pushed: the backend can fail before this script has even
      // run (a missing `uv` fails in milliseconds), and an event emitted then
      // would be dropped with no listener attached.
      const { invoke } = window.__TAURI__.core;

      const poll = setInterval(async () => {
        const failure = await invoke("startup_failure");
        if (!failure) return;
        clearInterval(poll);
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("error").classList.remove("hidden");
        document.getElementById("error-detail").textContent = failure;
      }, 300);
    </script>
  </body>
</html>
