[project]
name = "mailarc-ui"
version = "1.0.0"
description = "Mail archive UI: the whole interface — pages, shell, states and components"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Jens Rehpöhler" }]

# The one component that is allowed a browser, which is why it is the only one
# naming Reflex and the appkit UI packages.
dependencies = [
    "mailarc-core",
    "mailarc-sync",
    "mailarc-analytics",
    "reflex==0.9.10",
    "appkit-mantine>=1.14.0",
    "appkit-ui>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailarc_ui"]

[tool.pytest.ini_options]
cache_dir = "../../.cache/pytest"
testpaths = ["tests"]
asyncio_mode = "auto"
