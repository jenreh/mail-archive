[project]
name = "mailarc-sync"
version = "1.0.0"
description = "Mail archive sync: import engine, job queue and provider registry"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Jens Rehpöhler" }]

# The core and nothing else: the engine drives a provider through a port, so
# naming one here would put the vendor below the abstraction meant to hide it.
dependencies = ["mailarc-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailarc_sync"]

[tool.pytest.ini_options]
cache_dir = "../../.cache/pytest"
testpaths = ["tests"]
asyncio_mode = "auto"
