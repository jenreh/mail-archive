name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate portable SKILL.md folders
        run: python3 scripts/validate_skills.py
      - name: Validate plugins against Agent Plugins 1.0.0
        run: python3 scripts/validate_plugins.py
