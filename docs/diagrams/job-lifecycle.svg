<svg xmlns="http://www.w3.org/2000/svg" width="848" height="372" viewBox="0 0 848 372" role="img" aria-label="Job lifecycle">
<title>Job lifecycle</title>
<defs><marker id="aB3261E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B3261E" /></marker><marker id="a2E7D46" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#2E7D46" /></marker><marker id="a1F2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F2328" /></marker><marker id="a57606A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#57606A" /></marker></defs>
<rect width="848" height="372" fill="#FFFFFF" />
<g transform="translate(-36,-36)">
<rect x="60" y="180" width="180" height="62" rx="8" fill="#E0F7FA" stroke="#00707F" stroke-width="1.4" /><text x="150.0" y="208.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">queued</text><text x="150.0" y="222.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">waiting for a worker</text>
<rect x="360" y="180" width="200" height="62" rx="8" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.4" /><text x="460.0" y="208.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">running</text><text x="460.0" y="222.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">worker_id + lease_until</text>
<rect x="690" y="60" width="170" height="54" rx="8" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.4" /><text x="775.0" y="91.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">succeeded</text>
<rect x="690" y="180" width="170" height="54" rx="8" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.4" /><text x="775.0" y="204.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">failed</text><text x="775.0" y="218.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">error is recorded</text>
<rect x="690" y="300" width="170" height="54" rx="8" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.4" /><text x="775.0" y="324.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">cancelled</text><text x="775.0" y="338.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">asked to stop, not killed</text>
<rect x="60" y="60" width="180" height="54" rx="8" fill="#F3E8FD" stroke="#6B3FA0" stroke-width="1.4" /><text x="150.0" y="84.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">enqueue(kind, account)</text><text x="150.0" y="98.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">UI or scheduler</text>
<rect x="360" y="60" width="200" height="54" rx="8" fill="#FFFDE7" stroke="#C9A227" stroke-width="1.4" /><text x="460.0" y="84.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">heartbeat every 10 s</text><text x="460.0" y="98.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">pushes the lease out</text>
<rect x="360" y="330" width="200" height="54" rx="8" fill="#FFFDE7" stroke="#C9A227" stroke-width="1.4" /><text x="460.0" y="354.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">lease ran out</text><text x="460.0" y="368.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">reclaim_expired()</text>
