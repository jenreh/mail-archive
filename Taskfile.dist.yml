# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

# Every taskfile under ./taskfiles/ is shipped with the project. This block is
# the switchboard: an include is active when uncommented and inert when
# commented. Enable a feature later by uncommenting its block (and providing the
# files it needs, e.g. terraform/, alembic/). Copier pre-selected the set below
# from the answers you gave when the project was generated.
includes:
  qa:
    taskfile: ./taskfiles/Taskfile.qa.yml
    flatten: true
    vars:
      PROJECT: "{{.PROJECT}}"
  release: ./taskfiles/Taskfile.release.yml

  reflex:
    taskfile: ./taskfiles/Taskfile.reflex.yml
    flatten: true

  db:
    taskfile: ./taskfiles/Taskfile.db.yml

  graph:
    taskfile: ./taskfiles/Taskfile.graph.yml

  sync:
    taskfile: ./taskfiles/Taskfile.sync.yml

  # Everything an automated agent may run. Its own database, graph and blob
  # store under .state-agent/ — see the file's header for why PROFILES alone
  # is not enough.
  agent:
    taskfile: ./taskfiles/Taskfile.agent.yml

  docker:
    taskfile: ./taskfiles/Taskfile.docker.yml
    vars:
      IMAGE_NAME: "{{.PROJECT}}-image"

  tauri:
    taskfile: ./taskfiles/Taskfile.tauri.yml

  # dev:
  #   taskfile: ./taskfiles/Taskfile.terraform.yaml
  #   vars:
  #     TF_DIR: "{{.ROOT_DIR}}/terraform"
  #     ENVIRONMENT: dev
  # prod:
  #   taskfile: ./taskfiles/Taskfile.terraform.yaml
  #   vars:
  #     TF_DIR: "{{.ROOT_DIR}}/terraform"
  #     ENVIRONMENT: prod

  docs:
    taskfile: ./taskfiles/Taskfile.docs.yml

silent: true

vars:
  # Derived from the wheel package declared in pyproject.toml, so it always
  # matches the real package name (no template substitution needed here).
  PROJECT:
    sh: awk -F'"' '/^packages = \[/{print $2}' pyproject.toml

tasks:
  default:
    desc: Show available commands
    cmd: task --list

  # ----------------------------------------------------------------------------
  # Project Initialization and Dependency Management
  # ----------------------------------------------------------------------------

  init:
    desc: Initialize project (install python, sync deps, setup pre-commit)
    vars:
      PYTHON_VERSION:
        sh: |
          grep 'requires-python' pyproject.toml | sed -E 's/.*>=?([0-9]+\.[0-9]+).*/\1/'
    cmds:
      - echo "🐍 Installing Python {{.PYTHON_VERSION}}..."
      - uv python install {{.PYTHON_VERSION}}
      - uv python pin {{.PYTHON_VERSION}}
      - echo "📦 Syncing dependencies..."
      - uv sync --extra mcp
      - echo "🔒 Installing pre-commit hooks..."
      - uv tool list | grep -q pre-commit || uv tool install pre-commit
      - git rev-parse --git-dir >/dev/null 2>&1 || git init -b main
      - uv run pre-commit install

  install:
    desc: Install all dependencies (including dev extras)
    # `--extra mcp` because a developer environment is the web deployment: the
    # MCP server is a workspace member behind that extra (see the comment on
    # `[project.optional-dependencies]`), and the test suite covers it, so a
    # checkout synced without it would be green for the wrong reason. The
    # desktop shape is `uv sync` on its own — `task tauri:deps` shows what each
    # of the two resolves to.
    cmd: uv sync --extra mcp

  sync:
    desc: Install dependencies using uv
    cmd: uv sync --extra mcp

  clean:
    desc: Clean cache and build artifacts
    ignore_error: true
    cmds:
      - rm -rf __pycache__/ .cache/ .state/ .web/ dist/ build/ coverage.xml .coverage
      - find . -type d -name "__pycache__" -exec rm -rf {} +
      - find . -type f -name "*.pyc" -delete

  # ----------------------------------------------------------------------------
  # Isolation Probe (read by tests/test_taskfile_isolation.py)
  # ----------------------------------------------------------------------------

  env-probe:
    # A task that asks for nothing, so that everything it receives was pushed at
    # it. go-task merges every included taskfile's file-level `env:` into ONE
    # environment shared by the whole project, and that has pointed this
    # project's migrations at the real archive twice. The property is only
    # visible from outside the file that breaks it, so the test runs this and
    # reads what arrived: no `app_*` archive setting and no PROFILES may.
    #
    # `env` and not `echo` of named variables: an unset variable echoes as an
    # empty string and would pass whatever leaked under a different name.
    desc: Print this task's environment (used by the isolation test)
    cmd: env
