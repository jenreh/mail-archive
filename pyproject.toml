[project]
name = "mail-archive"
version = "1.0.0"
description = "Email archive and analysis"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Jens Rehpöhler" }]
keywords = []
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
]

dependencies = [
    "mailarc-core",
    "mailarc-sync",
    "mailarc-analytics",
    "mailarc-google",
    "mailarc-imap",
    "mailarc-m365",
    "mailarc-ui",
]

[project.optional-dependencies]
mcp = ["mailarc-mcp"]

[tool.uv.workspace]
members = ["components/*"]

[tool.uv.sources]
mailarc-core = { workspace = true }
mailarc-sync = { workspace = true }
mailarc-analytics = { workspace = true }
mailarc-google = { workspace = true }
mailarc-imap = { workspace = true }
mailarc-m365 = { workspace = true }
mailarc-mcp = { workspace = true }
mailarc-ui = { workspace = true }

[dependency-groups]
dev = [
    "bump-my-version>=1.3.0",
    "detect-secrets>=1.5.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-httpserver>=1.1.5",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.6",
    "ty>=0.0.78",
    "types-PyYAML>=6.0.12.20260510",
]

[project.scripts]
mail-archive-mcp = "app.mcp_server:main"

[project.urls]
Homepage = "https://github.com/jenreh/mail-archive"
Repository = "https://github.com/jenreh/mail-archive"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "/app",
    "/components",
    "README.md",
    "pyproject.toml",
]
exclude = [
    ".agents/",
    ".cache/",
    ".claude/",
    ".devcontainer/",
    ".github/",
    ".vscode/",
    "skill/",
    "spec/",
    "tests/",
    ".env",
    ".gitignore",
    ".pre-commit-config.yaml",
    "AGENTS.md",
    "coverage.xml",
    "Taskfile.yaml",
]

[tool.bumpversion]
commit = false
current_version = "1.0.0"
tag = false
allow-dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "configuration/config.yaml"
search = 'version: {current_version}'
replace = 'version: {new_version}'
[tool.ruff]
cache-dir = ".cache/ruff"
indent-width = 4
line-length = 88
target-version = "py314"
extend-exclude = [
    ".agents",
    ".cache",
    ".claude",
    ".devcontainer",
    ".github",
    ".vscode",
    "build",
    "dist",
    "docs/.vitepress/cache",
    "docs/.vitepress/dist",
    "docs/node_modules",
]

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "EM101",
    "EM102",
    "ISC001",
    "N811",
    "N818",
    "PLR0913",
    "PT011",
    "PT012",
    "RUF012",
    "RUF100",
    "SIM300",
    "E501",
    "B008",
    "ASYNC240",
    "PYI034",
    "S101",
    "PLR0912",
    "ASYNC109",
    "ARG001",
    "PLR2004",
    "PLW0603",
    "PLC0415",
    "SIM105",
    "PLW2901",
    "PLR0911",
    "B017",
    "RUF001",
    "RUF002",
    "RUF003",
]
select = [
    "A",
    "ANN001",
    "ANN201",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "EM",
    "EXE",
    "F",
    "FIX",
    "G",
    "ICN",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLF001",
    "T20",
    "TID",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
"*_doubles.py" = [
    "S101",
    "ANN001",
    "ARG002",
    "ARG005",
    "SLF001",
]
"test_**.py" = [
    "S101",
    "PLR2004",
    "ANN001",
    "S106",
    "SLF001",
    "RET504",
    "PERF401",
    "E402",
    "S501",
    "S110",
    "ARG002",
    "ARG005",
    "E741",
    "RUF059",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
exclude = ["*.pyi"]

[tool.ruff.lint.isort]
known-local-folder = [
    "app",
    "engine_doubles",
    "tests",
    "mailarc_core",
    "mailarc_sync",
    "mailarc_analytics",
    "mailarc_google",
    "mailarc_imap",
    "mailarc_m365",
    "mailarc_mcp",
    "mailarc_ui",
]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
addopts = "-p tests.sandbox_plugin"
pythonpath = ["."]
testpaths = [
    "tests",
    "components/mailarc-core/tests",
    "components/mailarc-sync/tests",
    "components/mailarc-analytics/tests",
    "components/mailarc-google/tests",
    "components/mailarc-imap/tests",
    "components/mailarc-m365/tests",
    "components/mailarc-mcp/tests",
    "components/mailarc-ui/tests",
]
asyncio_mode = "auto"
timeout = 60
markers = [
    "graph_local: starts the vendored FalkorDB (needs `task tauri:vendor`)",
]

[tool.ty.environment]
python-version = "3.14"
python = ".venv.mac"
extra-paths = ["scripts", "components/mailarc-imap/tests"]

[tool.ty.src]
exclude = [
    ".agents",
    ".cache",
    ".claude",
    ".venv",
    "build",
    "dist",
]

[tool.ty.rules]
unresolved-import = "warn"

[tool.coverage.run]
branch = true
source = [
    "app",
    "components/mailarc-core/src/mailarc_core",
    "components/mailarc-sync/src/mailarc_sync",
    "components/mailarc-analytics/src/mailarc_analytics",
    "components/mailarc-google/src/mailarc_google",
    "components/mailarc-imap/src/mailarc_imap",
    "components/mailarc-m365/src/mailarc_m365",
    "components/mailarc-mcp/src/mailarc_mcp",
    "components/mailarc-ui/src/mailarc_ui",
]
omit = []

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "pragma: no cover"]
fail_under = 80
show_missing = true
skip_covered = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
