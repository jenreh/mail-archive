<rect x="650" y="512" width="210" height="56" rx="8" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.4" /><text x="755.0" y="537.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328">Blob store</text><text x="755.0" y="551.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">.state/mailstore</text>
<rect x="200" y="620" width="600" height="58" rx="8" fill="#FFFDE7" stroke="#C9A227" stroke-width="1.4" /><text x="500.0" y="646.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">app/ may import any component. A component never imports app/.</text><text x="500.0" y="660.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#57606A">components/mailarc-core/tests/test_isolation.py fails if one does.</text>
