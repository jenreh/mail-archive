[project]
name = "mailarc-mcp"
version = "1.0.0"
description = "Mail archive MCP server: six read-only tools over the archive"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Jens Rehpöhler" }]

# Reads the ground truth the core wrote and the layer the analytics component
# derived, and serves both to a model. Never a sibling beyond those two: an MCP
# tool answers questions about an archive that already exists, so it has no
# business knowing how mail gets into one (`mailarc-sync`) or where it came
# from (`mailarc-google`).
#
# `fastmcp` is why this component exists at all — see the `mcp` extra in the
# root `pyproject.toml` for the measurement.
dependencies = [
    "fastmcp>=3.4.7",
    "mailarc-analytics",
    "mailarc-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailarc_mcp"]

[tool.pytest.ini_options]
cache_dir = "../../.cache/pytest"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "graph_local: starts the vendored FalkorDB (needs `task tauri:vendor`)",
]
