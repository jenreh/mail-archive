<path d="M 560.0 226.5 L 574.0 226.5 L 625.0 226.5 L 625.0 327.0 L 676.0 327.0 L 690.0 327.0" fill="none" stroke="#57606A" stroke-width="1.4" marker-end="url(#a57606A)" /><rect x="576.2" y="267.8" width="97.6" height="15" rx="3" fill="#FFFFFF" fill-opacity="0.95" /><text x="625.0" y="278.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#57606A">cancel_requested</text>
<path d="M 460.0 242.0 L 460.0 256.0 L 460.0 286.0 L 460.0 316.0 L 460.0 330.0" fill="none" stroke="#57606A" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a57606A)" />
<path d="M 360.0 357.0 L 346.0 357.0 L 150.0 357.0 L 150.0 256.0 L 150.0 242.0" fill="none" stroke="#57606A" stroke-width="1.4" marker-end="url(#a57606A)" /><rect x="105.9" y="348.0" width="103.2" height="15" rx="3" fill="#FFFFFF" fill-opacity="0.95" /><text x="157.5" y="359.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#57606A">back in the queue</text>
</g></svg>
