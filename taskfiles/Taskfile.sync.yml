# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

silent: true

vars:
  RUNNER: uv run

tasks:
  # ----------------------------------------------------------------------------
  # Mail Sync Commands (Namespace: sync)
  # ----------------------------------------------------------------------------

  worker:
    desc: |
      Run the import worker in the foreground (Ctrl-C stops it at the next job)
    env:
      PROFILES: local
    cmd: "{{.RUNNER}} python -m app.worker"

  # The sandboxed worker is `task agent:worker`. See taskfiles/Taskfile.agent.yml.
