[project]
name = "mailarc-m365"
version = "1.0.0"
description = "Mail archive Microsoft 365 adapter: Graph delta, paging and MIME fetch"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Jens Rehpöhler" }]

# Hangs off the core plus the two things a Microsoft Graph adapter needs itself:
# an HTTP client and Microsoft's own token library. Never a sibling component —
# `mailarc-sync` drives this adapter through the port and must not be able to
# name it, and `mailarc-google`'s OAuth module is the obvious thing to reach for
# and is out of reach on purpose: a second consent flow is written here, in this
# component, or it is not written at all.
dependencies = [
    "httpx>=0.28.1",
    "mailarc-core",
    "msal>=1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailarc_m365"]

[tool.pytest.ini_options]
cache_dir = "../../.cache/pytest"
testpaths = ["tests"]
asyncio_mode = "auto"
