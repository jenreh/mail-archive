services:
  mail-archive-app:
    container_name: mail-archive-app
    image: mail-archive-app
    build:
      context: .
      dockerfile: Dockerfile
    # Use the docker-specific env file (secrets for the local secret provider)
    env_file:
      - .env.docker
    volumes:
      # The SQLite file lives under .state/, which would otherwise die with the
      # container. Same directory the local FalkorDB writes into.
      - mail-archive-state:/reflexapp/.state
    ports:
      - "3030:3030"
      - "8080:8080"
      - "80:80"
    develop:
      watch:
        - action: sync
          path: ./app
          target: /reflexapp/app
        - action: sync
          path: ./components
          target: /reflexapp/components
        - action: sync
          path: ./assets
          target: /reflexapp/assets
        - action: sync
          path: ./configuration
          target: /reflexapp/configuration
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./start.sh

volumes:
  mail-archive-state:
    name: mail-archive-state
